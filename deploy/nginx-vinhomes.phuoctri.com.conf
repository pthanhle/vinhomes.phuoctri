# ============================================================================
# NGINX PRODUCTION CONFIG: vinhomes.phuoctri.com & phuoctri.com
# Khắc phục triệt để lỗi "remote error: tls: unrecognized name" trên apex domain
# và lỗi lặp 3 lần HTTP Security Headers của vinhomes.trongluu.com
# ============================================================================

# 1. Chuyển hướng HTTP (Port 80) -> HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name phuoctri.com www.phuoctri.com vinhomes.phuoctri.com www.vinhomes.phuoctri.com;
    return 301 https://vinhomes.phuoctri.com$request_uri;
}

# 2. [SEC-06 Fix] Apex Domain HTTPS (phuoctri.com) -> 301 Redirect về Subdomain
# (Cấp chứng chỉ SSL hợp lệ cho cả phuoctri.com để không bị lỗi TLS Unrecognized Name)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name phuoctri.com www.phuoctri.com www.vinhomes.phuoctri.com;

    ssl_certificate     /etc/letsencrypt/live/phuoctri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phuoctri.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://vinhomes.phuoctri.com$request_uri;
}

# 3. Main Production VirtualHost: https://vinhomes.phuoctri.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vinhomes.phuoctri.com;

    ssl_certificate     /etc/letsencrypt/live/phuoctri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phuoctri.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # [SEC-05 Fix] Khai báo HTTP Security Headers chuẩn xác 1 lần duy nhất (Không bị lặp x3)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Nén Gzip tốc độ cao (Thay thế hoàn toàn Cache Enabler plugin)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Phục vụ trực tiếp Media tĩnh (Không qua webpc-passthru.php trung gian)
    location /uploads/ {
        alias /var/www/vinhomes.phuoctri/public/uploads/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /vendor-css/ {
        alias /var/www/vinhomes.phuoctri/public/vendor-css/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Chặn các đường dẫn dò quét WordPress / MCP cũ ở tầng Nginx Edge
    location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-json/wp/v2/users|wp-json/elementor-mcp-composer|wp-json/mcp) {
        return 403 '{"code":"forbidden","message":"Blocked by PhuocTri Edge WAF"}';
        add_header Content-Type application/json;
    }

    # Reverse Proxy vào Next.js Enterprise Server
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
